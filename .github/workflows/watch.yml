name: passport-munich-watch

# Проверка слотов ДП «Документ» (Мюнхен) с IP раннера GitHub: наш домашний IP не задействован,
# а POST выполняет сам Chrome (страница), поэтому тело запроса знать не нужно.
# GitHub выполняет cron «по возможности» (минимум ~5 минут, бывает 5–15).

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: passport-munich-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Playwright
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          # На раннере уже есть Google Chrome; свой Chromium нужен только как запасной вариант
          python -m playwright install --with-deps chromium || true

      - name: Восстановить состояние (кулдаун алертов)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: passport-state-${{ github.run_id }}
          restore-keys: |
            passport-state-

      - name: Проверка слотов
        env:
          TG_DELIVERY: ${{ secrets.TG_DELIVERY }}
          TG_TARGET: ${{ secrets.TG_TARGET }}
          COOLDOWN_HOURS: "1"
        run: python watch_playwright.py

      - name: Сохранить состояние
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: passport-state-${{ github.run_id }}
